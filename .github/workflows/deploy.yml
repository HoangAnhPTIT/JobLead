name: Deploy to Server

on:
  push:
    branches:
      - develop  # Trigger on pushes to the 'develop' branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Build the Docker image
      - name: Build and tag Docker image
        run: docker build -t anhch/job-lead:${{ github.sha }} .

      # 4. Push the Docker image to Docker Hub
      - name: Push Docker image to Docker Hub
        run: docker push anhch/job-lead:${{ github.sha }}

      # 5. SSH into the server and deploy
      - name: Deploy to server
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            docker pull anhch/job-lead:${{ github.sha }}
            docker stop job-lead || true
            docker rm job-lead || true
            docker run -d --name job-lead --restart always -p 8888:3000 anhch/job-lead:${{ github.sha }}
